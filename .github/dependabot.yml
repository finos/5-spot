#
# Dependabot keeps SHA-pinned GitHub Actions, Rust crates, and Docker base
# images current. Each ecosystem opens PRs against main on the schedule below.
# PRs include the full release-notes diff and the new SHA, so reviewers can
# verify what changed before merging.
#
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # ─────────────────────────────────────────────────────────────────────────
  # GitHub Actions — re-pin SHAs when upstream cuts a new release.
  # Covers every workflow under .github/workflows AND the composite actions
  # under .github/actions. Dependabot rewrites both the SHA and the trailing
  # `# vX.Y.Z` comment automatically.
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    # Let freshly published releases bake for a week before proposing them —
    # supply-chain attacks on new action releases usually surface within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # One PR per week bundling routine first-party / tooling bumps.
      actions-routine:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "docker/*"
          - "github/codeql-action"
          - "softprops/action-gh-release"
          - "anchore/sbom-action"
          - "aquasecurity/trivy-action"
      # Security-sensitive actions get their own PRs so each one is reviewed
      # individually. Keep sigstore/ossf/cargo-deny out of grouped updates.
      # (Ungrouped entries always open as individual PRs.)
    ignore:
      # dtolnay/rust-toolchain tracks the `stable` branch and has no tags, so
      # Dependabot would see no "new version" to propose. It is re-pinned by
      # hand on the quarterly cadence documented in build.yaml.
      - dependency-name: "dtolnay/rust-toolchain"

  # ─────────────────────────────────────────────────────────────────────────
  # Rust crates (Cargo.lock) — keep transitive deps patched against RustSec
  # advisories. The cargo-audit + cargo-deny CI jobs will block merges that
  # regress the advisory status, so Dependabot can only land a PR that passes
  # those gates.
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    # Same 7-day bake-in as above — a malicious crates.io release is typically
    # yanked or flagged within days, and cargo-deny/audit still gate the merge.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  # ─────────────────────────────────────────────────────────────────────────
  # Docker base images — both runtime bases live at the repo root:
  #   Dockerfile              gcr.io/distroless/cc-debian13:nonroot
  #   Dockerfile.chainguard   cgr.dev/chainguard/glibc-dynamic:latest
  # Both publish rolling tags, so what Dependabot catches here are digest
  # bumps to the pinned `FROM image:tag@sha256:…` lines.
  #
  # The digest MUST sit on a real `FROM` instruction. Dependabot's docker
  # parser reads `FROM` lines only — it cannot see through `ARG BASE_IMAGE=…`
  # + `FROM ${BASE_IMAGE}`, which is how these files were written until
  # ADR 0010, and which made this entry a silent no-op. Keep the pin on the
  # `pinned-base` FROM line; the `FROM ${BASE_IMAGE}` override line below it
  # is simply skipped by the parser.
  #
  # Deliberately NOT covered here:
  #   - deploy/**/*.yaml — those pin our OWN ghcr.io/finos/5-spot* images to
  #     the current release; `make set-image-version` owns those tags, and a
  #     second updater would fight it.
  #   - .github/workflows/sast.yaml `container.image` (returntocorp/semgrep)
  #     and the `kindest/node` tags in the Makefile / examples — Dependabot
  #     parses neither a workflow `container:` image nor a Makefile variable,
  #     for any ecosystem. Those are re-pinned by hand.
  #
  # Base images stay UNGROUPED (unlike the actions above): each one is the
  # root of a different trust chain, and a base-image bump is exactly the kind
  # of change that deserves its own PR, its own Trivy/Grype scan and its own
  # review.
  # ─────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    # Same 7-day bake-in for freshly pushed base-image digests. NOTE the
    # trade-off: Chainguard rebuilds glibc-dynamic daily *to ship CVE fixes*,
    # so a 7-day cooldown means we deliberately run a digest that is up to a
    # week behind the patched one. That is the conservative supply-chain
    # choice (a poisoned base image is usually caught within days) and it is
    # a posture decision, not an oversight — revisit it here if CVE latency
    # ever matters more than bake-in time.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
