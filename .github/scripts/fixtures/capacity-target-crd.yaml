#
# A stand-in for the capacity consumer's CRD, for the ScheduledCapacity e2e
# (ADR 0011, actuation per ADR 0016). Test fixture only; never deployed.
#
# WHY IT USES THE REAL GROUP AND THE REAL KIND
#
# ADR 0016 made 5-Spot CREATE the capacity object, and the group allowlist
# (ALLOWED_CAPACITY_TARGET_API_GROUPS in src/constants.rs) applies to that create
# exactly as it applied to ADR 0011's patch. A stub under an invented group would
# therefore be refused by the controller before any interesting behaviour ran,
# and the only way to make the e2e pass would be to widen the allowlist for the
# test, which would mean the test no longer exercised the control. So the stub
# is `banlieue.io/v1alpha1 VirtualMachinePool`: the e2e drives the production
# path, allowlist included, against a cluster where the real consumer is not
# installed.
#
# WHY IT IS TYPED, AND MUST STAY THAT WAY
#
# rules/testing.md: "a fake that is more permissive than the real thing hides
# bugs". The required set and the gated field below mirror the real kind exactly,
# generated from its CRD:
#   spec.warmReplicas  integer uint32, minimum 0, required  <- the gated knob
#   spec.maxReplicas   integer uint32, minimum 0, required
#   spec.readiness     string enum, required, no default
#   spec.template      object, required
#   status.claimed     integer uint32, default 0            <- the drain signal
# with a status subresource, so status is written separately from spec exactly as
# it is on the real kind.
#
# The one deliberate permissiveness is the INTERIOR of spec.template, which is
# preserve-unknown-fields here and a full typed VirtualMachineTemplate on the
# real kind. That is not a gap this fixture can close and not one it needs to:
# 5-Spot treats the template as opaque by design (ADR 0016 decision 2), so there
# is no 5-Spot behaviour a stricter interior schema could catch. In production the
# consumer's own CRD validates it, and the e2e asserts only what 5-Spot is
# responsible for: that the template arrives unchanged.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachinepools.banlieue.io
spec:
  group: banlieue.io
  scope: Namespaced
  names:
    plural: virtualmachinepools
    singular: virtualmachinepool
    kind: VirtualMachinePool
    shortNames: [vmp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Warm
          type: integer
          jsonPath: .spec.warmReplicas
        - name: Max
          type: integer
          jsonPath: .spec.maxReplicas
        - name: Claimed
          type: integer
          jsonPath: .status.claimed
        - name: Owner
          type: string
          jsonPath: .metadata.ownerReferences[0].name
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [warmReplicas, maxReplicas, readiness, template]
              properties:
                warmReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                  description: >-
                    The gated knob, injected by 5-Spot from
                    spec.capacity.activeValue. Bounded below at 0 because the
                    inactive value ScheduledCapacity writes is a fixed zero, and
                    a consumer that rejected 0 would make handback impossible.
                maxReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                  description: >-
                    A sibling field from spec.template, present so the e2e can
                    assert that scaling warmReplicas leaves the operator's
                    template untouched.
                readiness:
                  type: string
                  enum: [GuestReady, InfrastructureReady]
                  description: >-
                    Required with no default on the real kind, so a template
                    that omitted it would be rejected by the API server. Present
                    here so the e2e proves 5-Spot forwards required template
                    fields rather than only the knob.
                template:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: >-
                    Opaque interior, deliberately. See the header: 5-Spot does
                    not model this and the e2e asserts only that it arrives
                    unchanged.
            status:
              type: object
              properties:
                claimed:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 0
                  description: >-
                    How much of the slice is in use. ScheduledCapacity watches
                    this as spec.handback.drainedPath and treats 0 as drained.
