[package]
name = "five_spot"
version = "0.3.3"
edition = "2021"
rust-version = "1.90"
authors = ["Erick Bourgeois <erick@jeb.ca>"]
description = "A cloud-native Kubernetes controller for managing machine scheduling on physical nodes"
license = "Apache-2.0"
repository = "https://github.com/finos/5-spot"

# Every binary is declared explicitly below, so auto-discovery is off. Without
# this, Cargo would treat each `src/bin/*_tests.rs` file as its own binary and
# fail on the missing `main`, which is why the `_tests.rs` convention
# (rules/testing.md) could not previously be applied to bin targets.
autobins = false

# The one runtime binary (ADR 0020). The controller, capacity controller, both
# spot-schedule providers and both node agents are subcommands of it, so a
# single image runs every component. Isolation between components comes from
# each one's own ServiceAccount and RBAC, not from separate binaries (the
# capacity controller still cannot delete a CAPI Machine; ADR 0011).
[[bin]]
name = "5spot"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[[bin]]
name = "crddoc"
path = "src/bin/crddoc.rs"

[[bin]]
name = "auto-vex-presence"
path = "src/bin/auto_vex_presence.rs"

[[bin]]
name = "auto-vex-reachability"
path = "src/bin/auto_vex_reachability.rs"



[dependencies]
# `unstable-runtime` is opt-in for `Controller::reconcile_on`, which we
# use in main.rs to feed per-child-cluster Node-watch events into the
# Controller. The feature is "unstable" in the SemVer sense (the API
# may change between minor kube-runtime versions) but is the canonical
# way to push external triggers into the controller loop.
kube = { version = "4.0", features = ["runtime", "derive", "client", "ws", "unstable-runtime"] }
kube-lease-manager = "0.12"
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
tokio = { version = "1", features = ["full"] }
# `ReceiverStream` adapter so an `mpsc::Receiver<ObjectRef<…>>` can be
# fed into `Controller::reconcile_on`. Used by main.rs to plumb
# child-cluster Node-watch events back into the controller.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Safe-Rust YAML (de)serializer; replaces the deprecated serde_yaml, whose
# unsafe-libyaml backend is unmaintained (RUSTSEC-2024-0449).
serde-saphyr = "1.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
schemars = "1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
# `protobuf` is prometheus's default feature but we only ever call
# `TextEncoder` (src/metrics.rs) — never the protobuf exposition format —
# so it's disabled here. That also drops the `protobuf`/`protobuf-support`
# crates and the duplicate `thiserror` 1.x tree they pull in.
prometheus = { version = "0.14", default-features = false, features = ["process"] }
# Canonical HTTP status codes (used in src/constants.rs to name the Kubernetes
# API error statuses we branch on, instead of hardcoding 404/409/429).
http = "1"
# warp 0.4 made every previously-default feature opt-in. We use
# `warp::serve` for the metrics + health/readiness HTTP servers
# (src/cmd/controller.rs and src/health.rs), so the `server` feature must be
# enabled explicitly.
warp = { version = "0.4", default-features = false, features = ["server"] }
toml = "1.1"
# SHA-256 for the kata-config agent's content/drift hashing and (Phase 4)
# the applied-hash node annotation. RustCrypto, pure-Rust, no system deps.
sha2 = "0.11"

# Linux-only — used by the reclaim-agent's rung 2 netlink proc connector
# subscriber (`src/netlink_proc.rs`). The portable byte parsers in that
# module have no `nix` dep; only the actual socket / bind / send / recv
# dance does. Non-Linux builds compile the module's `Subscriber::new` to
# a stub that returns `NetlinkError::Unsupported`.
[target.'cfg(target_os = "linux")'.dependencies]
# `sched` is `setns(2)`, for the hidden `5spot nsenter` subcommand the
# Kata-config agent uses to restart the host k0s service (ADR 0020).
nix = { version = "0.31", default-features = false, features = ["socket", "net", "uio", "sched"] }




[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15"
test-log = "0.2"
tempfile = "3"
tower-test = "0.4"
# Body-collection helpers for tower-test mock responses in
# src/reconcilers/helpers_tests.rs — test-only, so a dev-dependency
# (roadmap 04 flagged it as an unused *runtime* dep; the uses are in tests).
http-body-util = "0.1"
# Used by src/reconcilers/child_client_tests.rs to build base64-encoded
# Secret payloads for the tower-test mock server. base64 0.22 is already
# in the dependency graph transitively (kube / k8s-openapi pull it).
base64 = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
