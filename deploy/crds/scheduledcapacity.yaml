apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scheduledcapacities.5spot.finos.org
spec:
  group: 5spot.finos.org
  names:
    kind: ScheduledCapacity
    plural: scheduledcapacities
    shortNames:
    - scap
    singular: scheduledcapacity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.writtenValue
      name: Written
      type: integer
    - jsonPath: .spec.target.kind
      name: Target
      type: string
    - jsonPath: .spec.schedule.kind
      name: Schedule
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .spec.killSwitch
      name: KillSwitch
      type: boolean
    - jsonPath: .status.governedNode
      name: Node
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ScheduledCapacitySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Schedule-gated capacity (ADR 0011, actuation per ADR 0016).

              The **non-handover** pattern. A [`ScheduledMachine`] answers "this metal
              leaves the cluster when the schedule closes"; a `ScheduledCapacity` answers
              "this metal stays, and a bounded slice of it is conceded while the schedule
              is open".

              5-Spot **creates and owns** the object that carries that slice, in this
              resource's own namespace and under this resource's own name, and scales one
              numeric field on it. That is symmetric with [`ScheduledMachine`], which
              creates the CAPI `Machine` the schedule is the reason for, rather than
              reaching into an object somebody else made.

              Window close scales the owned object to **zero** and never deletes it, so
              its identity and the consumer's warm state survive to the next window.
              Removal happens only when this resource is deleted, by Kubernetes
              owner-reference garbage collection: the controller holds no `delete` verb at
              all, because RBAC cannot express "only objects you created" and garbage
              collection does not need it to.

              Reconciled by the separate `5spot-capacity-controller` binary under its own
              ServiceAccount, so compromising it cannot delete a CAPI `Machine` and
              compromising the machine controller cannot write capacity.
            properties:
              capacity:
                description: |-
                  **Required** name of the single numeric field to scale, and the value to
                  write while the schedule is active.
                properties:
                  activeValue:
                    description: |-
                      Value written to [`field`](Self::field) while the schedule is active.

                      At least `1`. The **inactive** value is fixed at
                      `CAPACITY_INACTIVE_VALUE` and is not configurable: a schedule that
                      hands nothing back is not a schedule, which also makes an active value
                      of zero meaningless. Window close writes that zero and leaves the object
                      standing; it is never a delete.
                    format: int64
                    maximum: 1000000.0
                    minimum: 1.0
                    type: integer
                  field:
                    description: |-
                      Name of the numeric field to scale, **relative to the owned object's
                      `spec`**: `warmReplicas`, not `spec.warmReplicas`. Dots are allowed for
                      a nested knob (`scale.warm`).

                      # Security

                      Rooting this at `spec` rather than validating its prefix is why it is no
                      longer a control (ADR 0016 decision 3). `metadata.` and `status.` are
                      not rejected, they are **unexpressible**: whatever this names is nested
                      under the `spec` of an object 5-Spot built before anything is sent, so
                      there is no reachable `ownerReferences`, `finalizers` or label to write
                      and no JSON Pointer escape to attempt. What the schema still enforces is
                      charset and depth, and the reconciler re-validates both because the
                      schema only holds while the deployed CRD is current.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z][a-zA-Z0-9]*(\.[a-z][a-zA-Z0-9]*){0,6}$
                    type: string
                required:
                - activeValue
                - field
                type: object
              enabled:
                default: true
                description: |-
                  Administrative master switch. When `false` the object is held
                  **Disabled** and capacity is driven to zero regardless of the provider.
                  Defaults to `true`.
                type: boolean
              handback:
                description: |-
                  Optional cooperative handback policy. Absent means handback completes as
                  soon as the zero write lands, which is the honest answer for a consumer
                  that exposes no in-use counter.
                nullable: true
                properties:
                  drainedPath:
                    description: |-
                      Dot-separated path of a numeric field on the target's **status** that
                      reports how much of the slice is still in use, e.g. `status.claimed`.
                      Handback is complete when it reads `CAPACITY_INACTIVE_VALUE`.

                      Pinned to the `status.` prefix by a CEL rule. Absent means there is
                      nothing to observe and handback completes on the zero write.
                    maxLength: 253
                    minLength: 8
                    pattern: ^[a-z][a-zA-Z0-9]*(\.[a-z][a-zA-Z0-9]*){0,7}$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.handback.drainedPath must start with 'status.'
                      rule: self.startsWith('status.')
                  timeout:
                    default: 10m
                    description: |-
                      How long to wait for [`drained_path`](Self::drained_path) to reach zero
                      before giving up on the wait (e.g. `"10m"`).

                      On expiry the controller **holds** the written value and reports
                      `HandbackTimedOut` loudly. It never forces the value to zero: a missed
                      handover is visible and recoverable, while killing in-flight work is
                      neither.
                    type: string
                type: object
              killSwitch:
                default: false
                description: |-
                  Immediate, terminal handback. Takes precedence over both
                  [`enabled`](Self::enabled) and the provider verdict.
                type: boolean
              nodeName:
                description: |-
                  Optional name of the Kubernetes Node this object believes it governs.

                  Supplying it enables the one-host-one-governor check: if this node is
                  also the `status.nodeRef` of a `ScheduledMachine` in this namespace,
                  the controller drives capacity to zero and withholds the active value,
                  because a host cannot both be handed over and shared.

                  Leave it unset if you cannot name the node confidently. The two objects
                  are then uncorrelated, no conflict is detected, and the invariant is
                  documentation only; a node name that collides with an unrelated
                  `ScheduledMachine` costs this consumer its capacity until corrected.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              schedule:
                description: |-
                  **Required** reference to the spot-schedule provider object that owns
                  the active/inactive decision. The same [`SpotScheduleRef`] shape ADR
                  0009 pinned for `ScheduledMachine`, resolved by the same
                  `resolve_spot_schedule` function, so provider semantics cannot drift
                  between the two controllers.

                  `Unresolved` is never treated as inactive: the last written value is
                  held and the reason reported.
                properties:
                  apiVersion:
                    description: |-
                      API version of the provider resource, `group/version`. The group MUST be
                      `spotschedules.5spot.finos.org` (CEL-pinned); e.g.
                      `spotschedules.5spot.finos.org/v1alpha1`.
                    maxLength: 253
                    minLength: 1
                    pattern: ^spotschedules\.5spot\.finos\.org/[A-Za-z0-9][A-Za-z0-9.-]*$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.schedule.apiVersion group must be spotschedules.5spot.finos.org
                      rule: self.startsWith('spotschedules.5spot.finos.org/')
                  kind:
                    description: Kind of the provider resource, e.g. `CapitalMarketsSchedule`.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Z][A-Za-z0-9]*$
                    type: string
                  name:
                    description: |-
                      Name of the provider object in **this `ScheduledMachine`'s namespace**.
                      RFC-1123 DNS subdomain (max 253 chars).
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              target:
                description: |-
                  **Required, immutable** kind of the object 5-Spot creates and owns to
                  carry this capacity. Its API group must be in
                  `ALLOWED_CAPACITY_TARGET_API_GROUPS`.

                  There is deliberately **no name**: the owned object takes this
                  `ScheduledCapacity`'s own name, in its own namespace, so the two can
                  never diverge and an edit can never orphan a previously owned object.
                  For the same reason the whole field is immutable (ADR 0016 decision 1):
                  changing the kind would leave the object of the old kind behind,
                  unmanaged, still holding an `ownerReference`.
                properties:
                  apiVersion:
                    description: |-
                      API version of the owned object, `group/version` (e.g.
                      `banlieue.io/v1alpha1`). The group must be in
                      `ALLOWED_CAPACITY_TARGET_API_GROUPS`, enforced in the reconciler.

                      The allowlist is deliberately **not** a CEL rule here: unlike the
                      spot-schedule group, which is one fixed value ADR 0009 pinned forever,
                      this list is an operator-visible security decision that must be
                      greppable in one place in `src/constants.rs` rather than baked into a
                      generated CRD that a stale `kubectl apply` could leave behind.
                    maxLength: 253
                    minLength: 3
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?/[A-Za-z0-9][A-Za-z0-9.-]*$
                    type: string
                  kind:
                    description: Kind of the owned resource, e.g. `VirtualMachinePool`.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Z][A-Za-z0-9]*$
                    type: string
                required:
                - apiVersion
                - kind
                type: object
                x-kubernetes-validations:
                - message: spec.target is immutable; delete and recreate the ScheduledCapacity to change the owned object's kind
                  rule: self == oldSelf
              template:
                description: |-
                  **Required** template forwarded verbatim as the owned object's `spec`,
                  with [`capacity.field`](CapacityWrite::field) injected into it.

                  Opaque by design (ADR 0016 decision 2), the same pass-through that
                  [`ScheduledMachineSpec::bootstrap_spec`] uses. 5-Spot does not and will
                  not model a consumer's schema: the reference consumer's pool needs
                  `maxReplicas`, `readiness` and a nested VM template, none of which is
                  5-Spot's business.

                  # Security

                  Whatever the consumer's CRD admits can be written here, and 5-Spot's
                  ServiceAccount creates it. This carries the same residual as an embedded
                  bootstrap spec, bounded the same two ways: the API-group allowlist, and
                  the consumer's own admission policies on whatever the owned object goes
                  on to create.

                  It must **not** itself set `capacity.field`: one source of truth, or the
                  template and the schedule fight on every reconcile.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - capacity
            - schedule
            - target
            - template
            type: object
          status:
            description: |-
              Runtime status of a [`ScheduledCapacity`].

              Its own surface, not [`ScheduledMachineStatus`]'s: a budget ramp and a drain
              wait are not node membership, and ADR 0007 makes a borrowed shape permanent.
            nullable: true
            properties:
              conditions:
                default: []
                description: |-
                  Standard Kubernetes conditions: `Ready`, `TargetResolved`,
                  `CapacityWritten`, `HandbackComplete`, `HostGovernanceConflict`, and
                  `SpotScheduleResolved` reused from ADR 0006.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last transition time (RFC3339 format)
                      type: string
                    message:
                      description: Human-readable message
                      type: string
                    reason:
                      description: One-word reason in CamelCase
                      type: string
                    status:
                      description: 'Status: "True", "False", or "Unknown"'
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: Type of condition (e.g., "Ready", "`MachineReady`", "`ReferencesValid`")
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              governedNode:
                description: |-
                  The Node this object believes it governs, echoed from
                  `spec.nodeName`. Reported even when the overlap check cannot run, so an
                  operator can correlate by hand (ADR 0011 decision 7).
                nullable: true
                type: string
              handbackDeadline:
                description: |-
                  When the current handback wait expires (RFC3339). Cleared once handback
                  completes or times out.
                nullable: true
                type: string
              lastWriteTime:
                description: When [`written_value`](Self::written_value) was last written (RFC3339).
                nullable: true
                type: string
              message:
                description: Human-readable status message.
                nullable: true
                type: string
              observedDrainedValue:
                description: |-
                  Last value read from `spec.handback.drainedPath`: how much of the slice
                  the consumer still reports in use.
                format: int64
                nullable: true
                type: integer
              observedGeneration:
                description: Observed generation for change detection.
                format: int64
                nullable: true
                type: integer
              phase:
                description: |-
                  Current phase: `Pending`, `Active`, `HandingBack`, `HandbackTimedOut`,
                  `Inactive`, `Disabled`, `Terminated`, or `Error`.
                nullable: true
                type: string
              ready:
                default: false
                description: '`true` only in the `Active` phase, surfaced for fast operator triage.'
                type: boolean
              spotSchedule:
                description: |-
                  Spot-schedule provider resolution state, the same
                  [`SpotScheduleStatus`] shape the machine controller publishes so one
                  `kubectl` habit reads both kinds.
                nullable: true
                properties:
                  active:
                    description: |-
                      Last known provider `status.active`. Held across an unresolved reconcile
                      (hold-last-state); `None` until the provider first resolves.
                    nullable: true
                    type: boolean
                  lastTransitionTime:
                    description: When `active` last transitioned (RFC3339).
                    nullable: true
                    type: string
                  message:
                    description: Human-readable resolution detail.
                    nullable: true
                    type: string
                  providerGeneration:
                    description: The provider's `status.observedGeneration` at the last resolution.
                    format: int64
                    nullable: true
                    type: integer
                  reason:
                    description: Machine-readable resolution reason (a `REASON_SPOT_SCHEDULE_*` value).
                    nullable: true
                    type: string
                  resolved:
                    description: |-
                      Whether the referenced provider resolved into an authoritative verdict
                      this reconcile. `false` mirrors a `SpotScheduleResolved=False`
                      condition — the provider CRD is absent, the object is missing, it
                      exposes no `status.active`, or it is not `Ready`.
                    type: boolean
                required:
                - resolved
                type: object
              targetRef:
                description: |-
                  The resolved target object, recorded so operators can see what was
                  actually written without re-resolving the reference.
                nullable: true
                properties:
                  apiVersion:
                    description: API version of the referenced object
                    type: string
                  kind:
                    description: Kind of the referenced object
                    type: string
                  name:
                    description: Name of the referenced object
                    type: string
                  namespace:
                    description: Namespace of the referenced object
                    nullable: true
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              writtenValue:
                description: |-
                  The value this controller last successfully wrote to
                  `spec.capacity.path`.

                  **Not** `skip_serializing_if = "Option::is_none"`-equivalent on zero: a
                  written `0` is meaningful state (handback in progress or complete) and
                  must survive serialisation.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: ScheduledCapacity
        type: object
    served: true
    storage: true
    subresources:
      status: {}
