# ServiceAccount for the schedule-gated capacity controller (ADR 0011).
#
# Deliberately a DIFFERENT identity from the 5-Spot machine controller's.
# Compromising this one cannot delete a CAPI Machine; compromising the machine
# controller cannot write capacity. That separation is the reason ADR 0011 chose
# a new binary over a second reconciler in the existing one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: 5spot-capacity-controller
  namespace: 5spot-system
  labels:
    app.kubernetes.io/name: 5spot
    app.kubernetes.io/component: capacity-controller
    app.kubernetes.io/part-of: 5spot
