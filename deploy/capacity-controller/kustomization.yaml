# Schedule-gated capacity controller (ADR 0011).
#
# The ScheduledCapacity CRD itself ships under deploy/crds/: apply that first
# (or let the top-level deploy pull it in). This kustomization installs the
# controller: its own ServiceAccount, its own least-privilege ClusterRole +
# binding (create and patch on one allowlisted target group, NO DELETE anywhere,
# no secrets, no CAPI), and the Deployment.
#
# Installing this is opt-in. A cluster with no capacity consumer needs none of
# it, which is what keeps the consumer dependency optional.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
