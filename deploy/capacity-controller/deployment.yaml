# Schedule-gated capacity controller (ADR 0011).
#
# The NON-handover pattern: a physical machine stays in the cluster the whole
# time and a bounded slice of it is conceded while a spot schedule is open. The
# controller writes ONE numeric field on a foreign object and never creates or
# deletes it.
#
# Same hardened posture as the 5-Spot controller and the provider binaries:
# non-root, read-only rootfs, all capabilities dropped, seccomp RuntimeDefault,
# distroless image. It makes no host calls and no network calls beyond the
# Kubernetes API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 5spot-capacity-controller
  namespace: 5spot-system
  labels:
    app: 5spot-capacity-controller
    app.kubernetes.io/name: 5spot
    app.kubernetes.io/component: capacity-controller
spec:
  # Single replica by default. Leader election is available (ENABLE_LEADER_ELECTION)
  # for an HA pair, and uses its OWN Lease so this controller's leadership never
  # gates the machine controller's.
  replicas: 1
  selector:
    matchLabels:
      app: 5spot-capacity-controller
  template:
    metadata:
      labels:
        app: 5spot-capacity-controller
        app.kubernetes.io/name: 5spot
        app.kubernetes.io/component: capacity-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: 5spot-capacity-controller
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Pin to a released version tag; NEVER use :latest (Trivy KSV-0013).
          image: ghcr.io/finos/5-spot:v0.3.0
          imagePullPolicy: IfNotPresent
          command: ["/5spot-capacity-controller"]
          env:
            - name: RUST_LOG
              value: "info"
            - name: RUST_LOG_FORMAT
              value: "json"
            - name: METRICS_PORT
              value: "8080"
            - name: HEALTH_PORT
              value: "8081"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
