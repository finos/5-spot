# Workshop WORKLOAD cluster — plain Cluster API with the Docker provider (CAPD).
#
# This defines a 1-node control plane only. It deliberately has NO worker
# MachineDeployment: the worker capacity is supplied on a time schedule by the
# 5-Spot `ScheduledMachine` (see scheduledmachine-business-hours.yaml).
#
# Everything here is upstream Cluster API — no k0smotron, no k0rdent.
#
# NOTE ON API VERSION: these manifests use the Cluster API `v1beta2` contract
# and CAPD's `Dev*` kinds (`DevCluster`, `DevMachineTemplate`, `DevMachine`)
# with the docker backend. They need Cluster API v1.11 or later; they were
# validated against v1.14.3, where the older `Docker*` kinds are deprecated in
# favour of these. The `v1beta2` shapes differ from `v1beta1` in more than the
# version string: references are `apiGroup` + `kind` + `name`,
# `KubeadmControlPlane.spec.machineTemplate.infrastructureRef` moved under
# `machineTemplate.spec`, and kubeadm's `extraArgs` / `kubeletExtraArgs` are
# lists of `name` / `value` pairs.
#
# 5-Spot does not constrain this. It passes the version component of
# `bootstrapSpec.apiVersion` through to the `Machine` it creates and emits the
# reference shape that contract requires (ADR 0017), so the worker in
# scheduledmachine-business-hours.yaml declares `v1beta2` to match this file.
#
# NOTE ON THE NODE IMAGE: pin `kindest/node` to a tag that matches your local
# `kind` version (see the kind release notes). The same tag is reused by the
# worker in scheduledmachine-business-hours.yaml.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: dev-cluster
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"] # matches the Calico install in the README
    services:
      cidrBlocks: ["10.128.0.0/12"]
    serviceDomain: cluster.local
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: dev-cluster-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DevCluster
    name: dev-cluster
---
# CAPD manages a HAProxy load-balancer container in front of the control plane.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevCluster
metadata:
  name: dev-cluster
  namespace: default
spec:
  backend:
    docker: {}
---
# Infrastructure template for the control-plane Machine(s).
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: dev-cluster-control-plane
  namespace: default
spec:
  template:
    spec:
      backend:
        docker:
          # Pin the image so the workshop is reproducible. Match your kind version.
          customImage: kindest/node:v1.31.0
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: dev-cluster-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.31.0
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DevMachineTemplate
        name: dev-cluster-control-plane
  kubeadmConfigSpec:
    # Standard CAPD control-plane settings (mirrors the clusterctl "docker"
    # development flavor).
    clusterConfiguration:
      apiServer:
        certSANs: [localhost, 127.0.0.1, 0.0.0.0, host.docker.internal]
      controllerManager:
        extraArgs:
          - name: enable-hostpath-provisioner
            value: "true"
    initConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
          # kind nodes run on a shared host; relax disk-pressure eviction so the
          # kubelet does not evict everything under normal laptop disk usage.
          - name: eviction-hard
            value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
    joinConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
          - name: eviction-hard
            value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
