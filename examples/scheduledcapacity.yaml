# Example ScheduledCapacity objects (ADR 0011, actuation per ADR 0016): the
# NON-handover pattern.
#
# A ScheduledMachine says "this physical machine leaves the cluster when the
# schedule closes". A ScheduledCapacity says the opposite: the machine STAYS in
# the cluster the whole time, and a bounded slice of it is conceded while the
# schedule is open. On a 32-core host whose incumbent only ever uses 16, that is
# how the spare cores get used without the incumbent ever losing the node.
#
# 5-Spot CREATES AND OWNS the object that carries that slice, in this object's
# own namespace and under this object's own name, and scales one numeric field
# on it. That is symmetric with ScheduledMachine, which creates the CAPI Machine
# the schedule is the reason for, rather than reaching into an object somebody
# else made.
#
# Window close scales the owned object to ZERO and never deletes it, so its
# identity and the consumer's warm state survive to the next window. Removal
# happens only when this object is deleted, by Kubernetes owner-reference
# garbage collection: the controller holds no `delete` verb at all.
#
# Reconciled by the separate 5spot-capacity-controller (deploy/capacity-controller/),
# under its own ServiceAccount. A cluster with no capacity consumer installs
# none of it.
#
# The schedule objects these reference are in timebasedspotschedule.yaml and
# capitalmarketsschedule.yaml. Each must live in the SAME namespace.
---
# Trading-day gating: while the NYSE session is OPEN the incumbent needs the
# whole host, so capacity is zero; outside it, 10 warm sandbox VMs are allowed.
#
# Note this is driven by the SAME CapitalMarketsSchedule a ScheduledMachine
# would use. The provider does not know or care which consumer reads it.
apiVersion: 5spot.finos.org/v1alpha1
kind: ScheduledCapacity
metadata:
  name: agent-sandbox-capacity
  namespace: default
spec:
  # Required. The same SpotScheduleRef shape ADR 0009 pinned, resolved by the
  # same code path as ScheduledMachine.spec.schedule, so the
  # Unresolved-is-not-Inactive rule cannot drift between the two controllers.
  schedule:
    apiVersion: spotschedules.5spot.finos.org/v1alpha1
    kind: CapitalMarketsSchedule
    name: nyse-trading-day

  # Administrative master switch. false holds this object Disabled and drives
  # capacity to zero regardless of what the provider reports. Defaults to true.
  enabled: true

  # Immediate, terminal handback. Takes precedence over enabled AND the
  # provider verdict. Defaults to false.
  killSwitch: false

  # Required and IMMUTABLE. The kind of object 5-Spot creates and owns. Its API
  # group must be in the ALLOWED_CAPACITY_TARGET_API_GROUPS allowlist
  # (src/constants.rs).
  #
  # There is deliberately NO `name`: the owned object takes THIS object's name
  # (`agent-sandbox-capacity`) in THIS object's namespace, so the two can never
  # diverge and an edit can never orphan a previously owned object. The kind is
  # immutable for the same reason: changing it would leave the object of the old
  # kind behind, still owned but with nothing reconciling it. The object 5-Spot
  # actually created is reported on status.targetRef.
  target:
    apiVersion: banlieue.io/v1alpha1
    kind: VirtualMachinePool

  # Required. The single numeric field to scale, and the value to write while
  # the schedule is active.
  #
  # `field` is RELATIVE TO THE OWNED OBJECT'S spec: `warmReplicas`, not
  # `spec.warmReplicas`. Dots are allowed for a nested knob (`scale.warm`).
  # Because the path is rooted at `spec` by construction, `metadata.` and
  # `status.` are not rejected, they are UNEXPRESSIBLE: there is no reachable
  # ownerReferences, finalizers or label to write and no JSON Pointer escape to
  # attempt. spec.template must not set this field itself: one source of truth,
  # or the template and the schedule fight on every reconcile.
  #
  # The INACTIVE value is fixed at 0 and is deliberately not configurable: a
  # schedule that hands nothing back is not a schedule. Window close writes that
  # zero and leaves the object standing.
  capacity:
    field: warmReplicas
    activeValue: 10

  # Required. Forwarded VERBATIM as the owned object's spec, with
  # capacity.field injected into it. Opaque by design: 5-Spot does not and will
  # not model a consumer's schema, so whatever the consumer's CRD admits goes
  # here unchanged. These fields are banlieue's VirtualMachinePool contract, not
  # 5-Spot's.
  #
  # Security: whatever you put here, 5-Spot's ServiceAccount creates. That is
  # bounded by the API-group allowlist above and by the consumer's own admission
  # policies on whatever the owned object goes on to create.
  template:
    maxReplicas: 20
    readiness: GuestReady
    template:
      classRef:
        name: small
      imageRef:
        name: kairos-debian-base

  # Optional. The cooperative, bounded handback.
  #
  # On deactivation the controller writes 0 and then WAITS for the consumer to
  # report drained, by reading drainedPath until it reaches 0. It does not
  # delete, force, or escalate: the consumer owns claim binding, idle expiry
  # and its own drain, and 5-Spot has no analogue of pod eviction for an agent
  # mid-task.
  #
  # If `timeout` expires with the consumer still not drained, the controller
  # HOLDS the written value, reports HandbackTimedOut loudly and emits a
  # metric. It never forces the value to zero: a missed handover is visible and
  # recoverable, while a killed agent task is neither.
  #
  # Omit the whole block for a consumer that exposes no in-use counter;
  # handback then completes as soon as the zero write lands.
  handback:
    drainedPath: status.claimed
    timeout: 10m

  # Optional, and worth setting. A host is governed by ScheduledMachine OR by
  # ScheduledCapacity, never both: one removes the node, the other keeps it and
  # shares it, and both pointed at one host half-works (the node is drained for
  # handover while a capacity gate is still sizing guests on it).
  #
  # Naming the node lets the controller detect that contradiction: if this node
  # is also the status.nodeRef of a ScheduledMachine in this namespace, it sets
  # HostGovernanceConflict, writes nothing but zero, and does not create the
  # owned object at all if it does not yet exist (ADR 0014, ADR 0016 decision
  # 8). Without it the two objects cannot be correlated and the invariant is
  # documentation only.
  nodeName: worker-3
---
# Minimal form: only the four required fields. Gates a pool on plain office
# hours, with no drain signal (so handback completes on the zero write) and no
# node declared (so the overlap check cannot run).
apiVersion: 5spot.finos.org/v1alpha1
kind: ScheduledCapacity
metadata:
  name: batch-capacity
  namespace: default
spec:
  schedule:
    apiVersion: spotschedules.5spot.finos.org/v1alpha1
    kind: TimeBasedSpotSchedule
    name: business-hours
  target:
    apiVersion: banlieue.io/v1alpha1
    kind: VirtualMachinePool
  capacity:
    field: warmReplicas
    activeValue: 4
  template:
    maxReplicas: 8
    readiness: GuestReady
    template:
      classRef:
        name: small
